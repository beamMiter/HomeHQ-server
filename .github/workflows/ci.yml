name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: homehq_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d homehq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_DSN: postgres://ci:ci@localhost:5432/homehq_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: Apply migrations
        run: go run ./cmd/migrate -cmd=up
      - name: Test (with the database tests)
        run: go test ./... -race
        env:
          TEST_DB_DSN: ${{ env.DB_DSN }}
